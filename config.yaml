transport: "streamable-http"
log_level: "INFO"
merge_threshold: 75
dehydration:
  model: "claude-sonnet-4-5-20250929"
  base_url: "https://code.newcli.com/claude/v1"
  max_tokens: 1024
  temperature: 0.1
decay:
  lambda: 0.05
  threshold: 0.3
  check_interval_hours: 24
  emotion_weights:
    base: 1.0
    arousal_boost: 0.8
scoring_weights:
  topic_relevance: 4.0
  emotion_resonance: 2.0
  time_proximity: 1.5
  importance: 1.0
matching:
  fuzzy_threshold: 50
  max_results: 5
wikilink:
  enabled: false
